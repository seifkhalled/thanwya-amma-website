<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة الثانوية العامة 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Inter", sans-serif;
  background: #f5f7fa;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 60px 20px;
  color: #1e293b;
}
.container { width: 100%; max-width: 800px; }
h1 {
  font-size: 28px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 8px;
}
.subtitle {
  text-align: center;
  color: #64748b;
  font-size: 14px;
  margin-bottom: 32px;
}
.search-box {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  margin-bottom: 24px;
}
.tabs {
  display: flex;
  gap: 4px;
  background: #f1f5f9;
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 16px;
}
.tab {
  flex: 1;
  text-align: center;
  padding: 10px;
  font-size: 14px;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  transition: .15s;
  border: none;
  background: transparent;
  color: #64748b;
}
.tab.active { background: #fff; color: #1e293b; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.tab:focus { outline: none; }
.input-row { display: flex; gap: 8px; }
.input-row input {
  flex: 1;
  padding: 12px 16px;
  font-size: 15px;
  border: 1.5px solid #e2e8f0;
  border-radius: 10px;
  outline: none;
  transition: .15s;
  font-family: inherit;
}
.input-row input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
.input-row button {
  padding: 12px 28px;
  font-size: 15px;
  font-weight: 500;
  background: #6366f1;
  color: #fff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: .15s;
  font-family: inherit;
}
.input-row button:hover { background: #4f46e5; }
.input-row button:disabled { opacity: .5; cursor: not-allowed; }
.results { margin-top: 8px; }
.result-card {
  background: #fff;
  border-radius: 12px;
  padding: 20px 24px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.result-info { display: flex; flex-direction: column; gap: 4px; }
.result-name { font-size: 16px; font-weight: 600; }
.result-id { font-size: 13px; color: #64748b; }
.result-meta { display: flex; align-items: center; gap: 20px; }
.result-degree {
  font-size: 24px;
  font-weight: 700;
  color: #6366f1;
}
.result-status {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
}
.status-pass { background: #dcfce7; color: #166534; }
.status-fail { background: #fef2f2; color: #991b1b; }
.status-second { background: #fef9c3; color: #854d0e; }
.no-results {
  text-align: center;
  padding: 48px 20px;
  color: #94a3b8;
  font-size: 15px;
}
.loading { text-align: center; padding: 24px; color: #94a3b8; }
.error { text-align: center; padding: 24px; color: #dc2626; }
.stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 24px;
  font-size: 14px;
  color: #64748b;
  background: #fff;
  border-radius: 12px;
  padding: 12px 24px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.stats span { display: flex; align-items: center; gap: 6px; }
@media (max-width: 600px) {
  .result-card { flex-direction: column; align-items: flex-start; }
  .result-meta { width: 100%; justify-content: space-between; }
}
</style>
</head>
<body>
<div class="container">
  <h1>نتيجة الثانوية العامة 2026</h1>
  <p class="subtitle">البحث عن النتيجة بواسطة الاسم أو رقم الجلوس</p>

  <div class="search-box">
    <div class="tabs">
      <button class="tab active" data-by="name" onclick="switchTab('name')">بحث بالاسم</button>
      <button class="tab" data-by="id" onclick="switchTab('id')">بحث برقم الجلوس</button>
    </div>
    <div class="input-row">
      <input type="text" id="searchInput" placeholder="ادخل اسم الطالب..." autocomplete="off">
      <button id="searchBtn" onclick="search()">بحث</button>
    </div>
  </div>

  <!--STATS-->

  <div id="results" class="results"></div>
</div>

<script>
let searchBy = "name";
const input = document.getElementById("searchInput");
const btn = document.getElementById("searchBtn");
const resultsDiv = document.getElementById("results");

function switchTab(mode) {
  searchBy = mode;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.by === mode));
  input.placeholder = mode === "name" ? "ادخل اسم الطالب..." : "ادخل رقم الجلوس...";
  input.value = "";
  resultsDiv.innerHTML = "";
  input.focus();
}

function statusClass(caseDesc) {
  const s = (caseDesc || "").toLowerCase();
  if (s.includes("ناجح") || s.includes("pass") || s.includes("success")) return "status-pass";
  if (s.includes("دور ثان") || s.includes("second")) return "status-second";
  return "status-fail";
}

input.addEventListener("keydown", e => { if (e.key === "Enter") search(); });

async function search() {
  const q = input.value.trim();
  if (!q) return;
  btn.disabled = true;
    resultsDiv.innerHTML = '<div class="loading">جاري البحث...</div>';
  try {
    const res = await fetch(`/search?q=${encodeURIComponent(q)}&by=${searchBy}`);
    const data = await res.json();
    if (data.error) { resultsDiv.innerHTML = `<div class="error">${data.error}</div>`; return; }
    if (!data.length) { resultsDiv.innerHTML = '<div class="no-results">لا توجد نتائج</div>'; return; }
    resultsDiv.innerHTML = data.map(s => `
      <div class="result-card">
        <div class="result-info">
          <div class="result-name">${s.arabic_name}</div>
          <div class="result-id">رقم الجلوس: ${s.seating_no}</div>
        </div>
        <div class="result-meta">
          <div class="result-degree">${s.total_degree}</div>
          <div class="result-status ${statusClass(s.student_case_desc)}">${s.student_case_desc}</div>
        </div>
      </div>
    `).join("");
  } catch (e) {
    resultsDiv.innerHTML = '<div class="error">حدث خطأ. حاول مرة أخرى.</div>';
  } finally { btn.disabled = false; }
}
</script>
</body>
</html>
