<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة الثانوية العامة 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #eef2ff;
  --bg: #f0f2f5;
  --card-bg: #fff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 40px rgba(99,102,241,.15);
}
body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
}
.hero {
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
  padding: 40px 20px 60px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 20% 50%, rgba(255,255,255,.15) 0%, transparent 50%),
              radial-gradient(circle at 80% 50%, rgba(255,255,255,.1) 0%, transparent 50%);
}
.hero h1 {
  font-size: 32px;
  font-weight: 800;
  color: #fff;
  position: relative;
  text-shadow: 0 2px 4px rgba(0,0,0,.1);
}
.hero p {
  color: rgba(255,255,255,.85);
  font-size: 16px;
  margin-top: 8px;
  position: relative;
}
.container {
  max-width: 720px;
  margin: -36px auto 0;
  padding: 0 16px;
  position: relative;
  z-index: 1;
}
.search-box {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px 24px 24px;
  box-shadow: var(--shadow-lg);
  margin-bottom: 20px;
}
.tabs {
  display: flex;
  gap: 4px;
  background: #f1f5f9;
  border-radius: var(--radius-sm);
  padding: 4px;
  margin-bottom: 16px;
}
.tab {
  flex: 1;
  padding: 10px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all .2s;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
}
.tab.active {
  background: var(--card-bg);
  color: var(--primary);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.input-row {
  display: flex;
  gap: 8px;
}
.input-row input {
  flex: 1;
  padding: 14px 18px;
  font-size: 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  transition: all .2s;
  font-family: inherit;
  background: #fafafa;
}
.input-row input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(99,102,241,.12);
  background: #fff;
}
.input-row button {
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
  white-space: nowrap;
}
.input-row button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.4); }
.input-row button:active { transform: translateY(0); }
.input-row button:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.results-count { font-size: 14px; color: var(--text-secondary); margin-top: 12px; text-align: center; }
.results { margin-top: 4px; }
.result-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
  animation: slideUp .35s ease backwards;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  border: 1px solid var(--border);
  transition: box-shadow .2s;
}
.result-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.result-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.result-name { font-size: 18px; font-weight: 700; line-height: 1.3; }
.result-id { font-size: 13px; color: var(--text-secondary); }
.result-id span { color: var(--text); font-weight: 600; }
.result-meta { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
.degree {
  position: relative;
  text-align: center;
}
.degree-value {
  font-size: 28px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1;
}
.degree-label {
  font-size: 11px;
  color: var(--text-secondary);
  display: block;
  margin-top: 2px;
}
.status-badge {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
.status-pass {
  background: linear-gradient(135deg, #dcfce7, #bbf7d0);
  color: #166534;
}
.status-fail {
  background: linear-gradient(135deg, #fef2f2, #fecaca);
  color: #991b1b;
}
.status-second {
  background: linear-gradient(135deg, #fef9c3, #fde68a);
  color: #854d0e;
}
.skeleton {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
}
.skeleton-line {
  height: 16px;
  border-radius: 8px;
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  margin-bottom: 8px;
}
.skeleton-line:last-child { width: 60%; margin-bottom: 0; }
.skeleton-line:first-child { width: 80%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.no-results {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-secondary);
  font-size: 16px;
}
.error-msg {
  text-align: center;
  padding: 24px 20px;
  color: #dc2626;
  font-size: 15px;
  background: #fef2f2;
  border-radius: var(--radius);
  margin-top: 8px;
}
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-bottom: 20px;
  font-size: 14px;
  color: var(--text-secondary);
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  flex-wrap: wrap;
}
.stats-bar span { display: flex; align-items: center; gap: 6px; }
.stats-bar strong { color: var(--text); font-weight: 700; }
.footer {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-secondary);
  font-size: 13px;
}
.footer a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
}
.footer a:hover { text-decoration: underline; }
@media (max-width: 600px) {
  .hero h1 { font-size: 24px; }
  .hero { padding: 28px 16px 48px; }
  .container { margin-top: -28px; }
  .search-box { padding: 16px 16px 20px; }
  .input-row { flex-direction: column; }
  .input-row button { width: 100%; }
  .result-card { flex-direction: column; align-items: flex-start; }
  .result-meta { width: 100%; justify-content: space-between; }
  .stats-bar { gap: 16px; font-size: 13px; }
  .degree-value { font-size: 24px; }
}
</style>
</head>
<body>

<div class="hero">
  <h1>نتيجة الثانوية العامة 2026</h1>
  <p>البحث عن النتيجة بواسطة الاسم أو رقم الجلوس</p>
</div>

<div class="container">
  <!--STATS-->

  <div class="search-box">
    <div class="tabs">
      <button class="tab active" data-by="name" onclick="switchTab('name')">بحث بالاسم</button>
      <button class="tab" data-by="id" onclick="switchTab('id')">بحث برقم الجلوس</button>
    </div>
    <div class="input-row">
      <input type="text" id="searchInput" placeholder="ادخل اسم الطالب..." autocomplete="off">
      <button id="searchBtn" onclick="search()">بحث</button>
    </div>
    <div id="resultsCount" class="results-count"></div>
  </div>

  <div id="results" class="results"></div>
</div>

<div class="footer">
  © 2026 — جميع الحقوق محفوظة &mdash; <a href="https://www.linkedin.com/in/seif-khaled-83bb99252/" target="_blank" rel="noopener">Seif Khaled</a>
</div>

<script>
let searchBy = 'name';
const input = document.getElementById('searchInput');
const btn = document.getElementById('searchBtn');
const resultsDiv = document.getElementById('results');
const countDiv = document.getElementById('resultsCount');

function switchTab(mode) {
  searchBy = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.by === mode));
  input.placeholder = mode === 'name' ? 'ادخل اسم الطالب...' : 'ادخل رقم الجلوس...';
  input.value = '';
  resultsDiv.innerHTML = '';
  countDiv.textContent = '';
  input.focus();
}

function statusClass(caseDesc) {
  const s = (caseDesc || '').toLowerCase();
  if (s.includes('ناجح') || s.includes('pass') || s.includes('success')) return 'status-pass';
  if (s.includes('دور ثان') || s.includes('second')) return 'status-second';
  return 'status-fail';
}

function showSkeleton() {
  resultsDiv.innerHTML = Array.from({length: 3}, () =>
    `<div class="skeleton">
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </div>`
  ).join('');
}

input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

async function search() {
  const q = input.value.trim();
  if (!q) return;
  btn.disabled = true;
  countDiv.textContent = '';
  showSkeleton();
  try {
    const res = await fetch(`/search?q=${encodeURIComponent(q)}&by=${searchBy}`);
    const data = await res.json();
    if (data.error) { resultsDiv.innerHTML = `<div class="error-msg">${data.error}</div>`; return; }
    if (!data.length) {
      resultsDiv.innerHTML = '<div class="no-results">لا توجد نتائج للبحث</div>';
      return;
    }
    countDiv.textContent = `تم العثور على ${data.length} نتيجة`;
    resultsDiv.innerHTML = data.map((s, i) =>
      `<div class="result-card" style="animation-delay:${i * 60}ms">
        <div class="result-info">
          <div class="result-name">${s.arabic_name}</div>
          <div class="result-id">رقم الجلوس: <span>${s.seating_no}</span></div>
        </div>
        <div class="result-meta">
          <div class="degree">
            <div class="degree-value">${s.total_degree}</div>
            <span class="degree-label">الدرجة</span>
          </div>
          <div class="status-badge ${statusClass(s.student_case_desc)}">${s.student_case_desc}</div>
        </div>
      </div>`
    ).join('');
  } catch (e) {
    resultsDiv.innerHTML = '<div class="error-msg">حدث خطأ في الاتصال. حاول مرة أخرى.</div>';
  } finally { btn.disabled = false; }
}
</script>
</body>
</html>
